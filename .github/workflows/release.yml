name: Release AeroDesk

on:
  workflow_run:
    workflows: ["Build AeroDesk"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout AeroDesk
        uses: actions/checkout@v4

      - name: Download successful build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: AeroDesk-win-x64
          path: publish/win-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: dotnet publish src/AeroDesk/AeroDesk.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/win-x64

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $version = "0.1.${{ github.event.workflow_run.run_number }}"
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build AeroDesk installer
        shell: pwsh
        run: |
          $iss = Join-Path $env:GITHUB_WORKSPACE 'installer\AeroDesk.iss'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'installer\output\AeroDesk-Setup.exe' "AeroDesk-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Package portable files
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath "AeroDesk-Portable-${{ steps.version.outputs.version }}.zip"

      - name: Package release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path publish/win-x64 -File)
          if ($files.Count -eq 1) {
            Copy-Item $files[0].FullName "AeroDesk-win-x64-${{ steps.version.outputs.version }}-$($files[0].Name)"
          } else {
            Compress-Archive -Path publish/win-x64/* -DestinationPath "AeroDesk-win-x64-${{ steps.version.outputs.version }}.zip"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AeroDesk v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          generate_release_notes: true
          files: |
            AeroDesk-Setup-*.exe
            AeroDesk-Portable-*.zip
            AeroDesk-win-x64-*
