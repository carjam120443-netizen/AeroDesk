name: Release AeroDesk

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64
        run: dotnet publish src/AeroDesk/AeroDesk.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/win-x64

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath AeroDesk-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AeroDesk-win-x64.zip
          generate_release_notes: true
