name: Build AeroDesk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AeroDesk.sln

      - name: Build
        run: dotnet build AeroDesk.sln --configuration Release --no-restore

      - name: Publish portable build
        run: dotnet publish src/AeroDesk/AeroDesk.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroDesk-win-x64
          path: publish/win-x64/
